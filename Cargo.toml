[workspace]
resolver = "3"
members = ["vendor/vera20k/src", "crates/vera-web-core", "crates/asset-export"]

[workspace.dependencies]
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[workspace.lints.clippy]
debug_assert_with_mut_call = "deny"
too_many_arguments = "allow"

[profile.dev]
debug = 0
opt-level = 1
incremental = false

[profile.release]
debug = 0
opt-level = 2
codegen-units = 16
lto = false
strip = "debuginfo"
incremental = false
